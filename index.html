<!DOCTYPE html>
<html lang="bn" data-theme="standard">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping List</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }

  :root[data-theme="standard"] {
    --page-bg: linear-gradient(180deg, #f5f3ff 0%, #fdf4ff 45%, #ecfdf5 100%);
    --header-grad: linear-gradient(135deg, #7c3aed, #d946ef, #fb923c);
    --header-shadow: rgba(217,70,239,0.25);
    --card-bg: #ffffff;
    --card-shadow: rgba(100,100,150,0.06);
    --text-main: #334155;
    --text-dim: #94a3b8;
    --accent: #7c3aed;
    --accent2: #d946ef;
    --success: #10b981;
    --success-bg: #d1fae5;
    --empty-border: #ddd6fe;
    --input-border: #d946ef;
  }
  :root[data-theme="dark"] {
    --page-bg: linear-gradient(180deg, #0f172a 0%, #111827 50%, #0b1220 100%);
    --header-grad: linear-gradient(135deg, #4c1d95, #a21caf, #9a3412);
    --header-shadow: rgba(162,28,175,0.35);
    --card-bg: #1e293b;
    --card-shadow: rgba(0,0,0,0.35);
    --text-main: #e2e8f0;
    --text-dim: #64748b;
    --accent: #c084fc;
    --accent2: #e879f9;
    --success: #34d399;
    --success-bg: #064e3b;
    --empty-border: #4c1d5533;
    --input-border: #c084fc;
  }
  :root[data-theme="ocean"] {
    --page-bg: linear-gradient(180deg, #ecfeff 0%, #f0f9ff 45%, #ecfdf5 100%);
    --header-grad: linear-gradient(135deg, #0891b2, #06b6d4, #10b981);
    --header-shadow: rgba(6,182,212,0.28);
    --card-bg: #ffffff;
    --card-shadow: rgba(6,100,150,0.08);
    --text-main: #164e63;
    --text-dim: #64a3ad;
    --accent: #0891b2;
    --accent2: #0d9488;
    --success: #059669;
    --success-bg: #d1fae5;
    --empty-border: #a5f3fc;
    --input-border: #0891b2;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--page-bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 12px;
  }
  @media (min-width: 480px) { body { padding: 24px; } }

  .wrap { width: 100%; max-width: 400px; }

  .header {
    border-radius: 22px;
    padding: 14px 18px 16px 18px;
    background: var(--header-grad);
    box-shadow: 0 10px 30px var(--header-shadow);
    color: white;
    position: relative;
  }
  .header-top { display: flex; align-items: center; gap: 10px; }
  .header-icon {
    width: 38px; height: 38px; border-radius: 12px;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .header-title { font-weight: 800; font-size: 18px; }
  .header-owner { font-size: 12px; opacity: 0.85; margin-top: 2px; line-height: 1.4; }
  .owner-btn {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 2px 0 0 0;
    margin: 0;
    color: white;
    font-family: inherit;
    cursor: pointer;
  }
  .owner-btn .line { font-size: 12px; opacity: 0.85; line-height: 1.4; }
  .owner-btn .hint { opacity: 0.7; font-style: italic; }

  .owner-edit { margin: 10px 6px 0 6px; }
  .owner-edit .add-bar { margin: 0 0 8px 0; }
  .owner-edit .save-btn {
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: white;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    padding: 9px 16px;
    cursor: pointer;
  }
  .owner-edit .cancel-btn {
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    padding: 9px 12px;
    cursor: pointer;
  }

  .theme-btn {
    position: absolute;
    top: 14px; right: 14px;
    width: 32px; height: 32px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.22);
    color: white;
    font-size: 15px;
    cursor: pointer;
  }

  .add-bar {
    margin: 10px 6px 0 6px;
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: 0 6px 20px var(--card-shadow);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
  }
  .add-bar input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    font-size: 14px;
    padding: 8px 4px;
    color: var(--text-main);
    background: transparent;
    font-family: inherit;
  }
  .add-bar input::placeholder { color: var(--text-dim); }
  .add-btn {
    width: 36px; height: 36px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: white;
    font-size: 20px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .add-btn:active { transform: scale(0.9); }

  .section { margin-top: 18px; }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px 8px 6px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
  }
  .section-count {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--card-bg);
    color: var(--accent);
  }
  .section.bought .section-title { color: var(--success); }
  .section.bought .section-count { background: var(--success-bg); color: var(--success); }

  .clear-btn {
    border: none;
    background: var(--success-bg);
    color: var(--success);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
  }

  .cat-label {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    margin: 0 0 6px 4px;
  }

  .list { padding: 0 4px; }
  .empty {
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    padding: 24px 16px;
    background: var(--card-bg);
    opacity: 0.7;
    border: 2px dashed var(--empty-border);
    border-radius: 18px;
  }

  .item-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 10px 12px;
    margin-bottom: 8px;
    box-shadow: 0 2px 8px var(--card-shadow);
    border-left: 4px solid var(--accent2);
  }
  .section.bought .item-row { border-left-color: var(--success); opacity: 0.75; }

  .checkbox {
    width: 24px; height: 24px;
    border-radius: 999px;
    border: 2px solid var(--accent2);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    background: transparent;
    font-size: 13px;
    color: white;
  }
  .checkbox.checked { background: var(--success); border-color: var(--success); }

  .item-name {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-main);
    padding: 4px 2px;
    overflow-wrap: anywhere;
  }
  .item-name.done { text-decoration: line-through; color: var(--text-dim); }
  .item-name-input {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-main);
    border: none;
    border-bottom: 2px solid var(--input-border);
    outline: none;
    padding: 4px 2px;
    background: transparent;
    font-family: inherit;
  }
  .qty-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(128,128,128,0.1);
    border-radius: 999px;
    padding: 2px 8px;
    flex-shrink: 0;
  }
  .qty-btn {
    border: none;
    background: transparent;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    width: 18px;
  }
  .qty-val {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-main);
    min-width: 16px;
    text-align: center;
  }
  .icon-btn {
    border: none;
    background: transparent;
    font-size: 15px;
    cursor: pointer;
    width: 24px;
    flex-shrink: 0;
    color: var(--text-dim);
  }
  .icon-btn.edit-btn:hover { color: var(--accent); }
  .icon-btn.remove-btn:hover { color: #f43f5e; }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  input[type="date"] { color-scheme: light; }
  :root[data-theme="dark"] input[type="date"] { color-scheme: dark; }
</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shopping List">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<script>
  // থিম আগেই বসানো হয়, তাই লোডের সময় ঝলক লাগে না
  try {
    var savedTheme = localStorage.getItem("shopping-list:theme");
    if (["standard", "dark", "ocean"].indexOf(savedTheme) !== -1) {
      document.documentElement.setAttribute("data-theme", savedTheme);
    }
  } catch (e) {}
</script>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <button class="theme-btn" id="themeBtn" title="থিম বদলাও">🎨</button>
      <div class="header-top">
        <div class="header-icon">🛒</div>
        <div>
          <div class="header-title">Shopping List</div>
          <button class="owner-btn" id="ownerBtn" title="নাম-নম্বর বদলাও">
            <div class="line" id="ownerName"></div>
            <div class="line" id="ownerPhone"></div>
          </button>
          <div class="header-owner" id="headerDate"></div>
        </div>
      </div>
    </div>

    <div class="owner-edit" id="ownerEdit" hidden>
      <div class="add-bar">
        <input type="text" id="ownerNameInput" placeholder="তোমার নাম" autocomplete="name">
      </div>
      <div class="add-bar">
        <input type="tel" id="ownerPhoneInput" placeholder="মোবাইল নম্বর" inputmode="tel" autocomplete="tel">
      </div>
      <div style="text-align:right; padding:0 4px;">
        <button class="cancel-btn" id="ownerCancel">বাতিল</button>
        <button class="save-btn" id="ownerSave">সেভ করো</button>
      </div>
    </div>

    <div class="add-bar">
      <input type="text" id="itemInput" placeholder="আইটেম লিখুন...">
      <button class="add-btn" id="addBtn">+</button>
    </div>

    <div class="section tobuy">
      <div class="section-header">
        <div class="section-title">🟣 কেনার লিস্ট</div>
        <div class="section-count"><span id="countToBuy">0</span></div>
      </div>
      <div class="list" id="listToBuy"></div>
    </div>

    <div class="section bought">
      <div class="section-header">
        <div class="section-title">✅ কেনা হয়ে গেছে</div>
        <div class="section-count"><span id="countBought">0</span></div>
      </div>
      <div class="list" id="listBought"></div>
      <div style="text-align:center; margin-top:6px;">
        <button class="clear-btn" id="clearBtn" style="display:none;">লিস্ট থেকে মুছে ফেলো</button>
      </div>
    </div>

    <div class="section history">
      <div class="section-header">
        <div class="section-title">🔍 History সার্চ</div>
      </div>
      <div class="add-bar" style="margin-top:0;">
        <input type="date" id="historyDate">
        <button class="add-btn" id="historyBtn">🔍</button>
      </div>
      <div class="list" id="historyResult" style="margin-top:10px;"></div>
    </div>
  </div>

<script>
  const STORAGE_KEY = "shopping-list:v6";
  const RESET_KEY = "shopping-list:lastResetDate";
  const HISTORY_KEY = "shopping-list:history";
  const THEME_KEY = "shopping-list:theme";
  const OWNER_KEY = "shopping-list:owner";
  const THEMES = ["standard", "dark", "ocean"];
  const HISTORY_DAYS = 90;

  let items = [];
  let history = {};
  let editingId = null;
  let owner = { name: "", phone: "" };
  let lastRenderedDay = "";

  const CATEGORIES = [
    { key: "general", label: "সাধারণ", color: "#7c3aed", bg: "#ede9fe" },
    { key: "oushud", label: "ঔষধ", color: "#0891b2", bg: "#cffafe" },
  ];

  // ইংরেজি অক্ষরে লেখা = ঔষধ, বাংলায় লেখা = সাধারণ।
  // সংখ্যা আর সাধারণ ইউনিট (kg, ml, pcs...) হিসাবের বাইরে রাখা হয়,
  // যাতে "চাল 5 kg" ভুল করে ঔষধ না হয়।
  const UNIT_WORDS = ["kg","kgs","gm","gms","gram","grams","mg","ml","ltr","liter","litre","l","g",
                      "pc","pcs","piece","pieces","packet","packets","pack","box","boxes","dozen",
                      "half","kilo","bottle","cup","set","no","nos"];

  function guessCategory(name) {
    let n = (name || "").toLowerCase();
    UNIT_WORDS.forEach(u => {
      n = n.replace(new RegExp("(^|[^a-z])" + u + "(?![a-z])", "g"), "$1");
    });
    return /[a-z]/.test(n) ? "oushud" : "general";
  }

  function catInfo(key) {
    return CATEGORIES.find(c => c.key === key) || CATEGORIES[0];
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function dateKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function todayStr() { return dateKey(new Date()); }

  /* ---------- storage ---------- */

  // সব ডেটা ফোনের ব্রাউজারেই (localStorage) থাকে — ইন্টারনেট লাগে না
  function readStore(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function writeStore(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  function loadHistory() {
    try {
      const raw = readStore(HISTORY_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = {}; }
    if (!history || typeof history !== "object") history = {};
  }
  function saveHistory() {
    writeStore(HISTORY_KEY, JSON.stringify(history));
  }
  function loadItems() {
    try {
      const raw = readStore(STORAGE_KEY);
      if (raw) items = JSON.parse(raw);
    } catch (e) { items = []; }
    if (!Array.isArray(items)) items = [];
    // ক্যাটাগরি নাম থেকেই বের হয়, তাই লোডের সময় সবগুলো আবার হিসাব করা হয়
    let migrated = false;
    items.forEach(it => {
      const cat = guessCategory(it.name || "");
      if (it.category !== cat) { it.category = cat; migrated = true; }
    });
    if (migrated) saveItems();
  }
  function saveItems() {
    writeStore(STORAGE_KEY, JSON.stringify(items));
  }

  // ৯০ দিনের পুরোনো ও খালি এন্ট্রি ছেঁটে ফেলা, যাতে storage limit-এ না ঠেকে
  function pruneHistory() {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - HISTORY_DAYS);
    const cutoffKey = dateKey(cutoff);
    let changed = false;
    Object.keys(history).forEach(k => {
      const entries = history[k];
      if (k < cutoffKey || !Array.isArray(entries) || entries.length === 0) {
        delete history[k];
        changed = true;
      }
    });
    return changed;
  }

  /* ---------- নাম ও নম্বর (শুধু এই ফোনে থাকে) ---------- */

  function loadOwner() {
    try {
      const raw = readStore(OWNER_KEY);
      if (raw) owner = JSON.parse(raw);
    } catch (e) { owner = { name: "", phone: "" }; }
    if (!owner || typeof owner !== "object") owner = { name: "", phone: "" };
    owner.name = owner.name || "";
    owner.phone = owner.phone || "";
  }

  function renderOwner() {
    const nameEl = document.getElementById("ownerName");
    const phoneEl = document.getElementById("ownerPhone");
    if (!owner.name && !owner.phone) {
      nameEl.textContent = "✎ নাম-নম্বর যোগ করো";
      nameEl.className = "line hint";
      phoneEl.textContent = "";
    } else {
      nameEl.textContent = owner.name;
      nameEl.className = "line";
      phoneEl.textContent = owner.phone;
    }
  }

  function openOwnerEdit() {
    document.getElementById("ownerNameInput").value = owner.name;
    document.getElementById("ownerPhoneInput").value = owner.phone;
    document.getElementById("ownerEdit").hidden = false;
    document.getElementById("ownerNameInput").focus();
  }

  function closeOwnerEdit() {
    document.getElementById("ownerEdit").hidden = true;
  }

  function saveOwner() {
    owner.name = document.getElementById("ownerNameInput").value.trim();
    owner.phone = document.getElementById("ownerPhoneInput").value.trim();
    writeStore(OWNER_KEY, JSON.stringify(owner));
    closeOwnerEdit();
    renderOwner();
  }

  /* ---------- history sync ---------- */

  // আজকের history এন্ট্রি আইটেমের বর্তমান নাম/qty দিয়ে আপডেট করে
  function syncHistoryEntry(it) {
    const entries = history[todayStr()];
    if (!Array.isArray(entries)) return false;
    const idx = entries.map(e => e.id).lastIndexOf(it.id);
    if (idx === -1) return false;
    entries[idx] = { id: it.id, name: it.name, qty: it.qty };
    return true;
  }

  /* ---------- daily reset ---------- */

  function checkDailyReset() {
    const lastReset = readStore(RESET_KEY);
    const today = todayStr();
    if (lastReset === today) return false;

    if (lastReset) {
      items = items.map(i => ({ ...i, bought: false }));
      saveItems();
    }
    writeStore(RESET_KEY, today);
    if (pruneHistory()) saveHistory();
    return true;
  }

  /* ---------- theme ---------- */

  function cycleTheme() {
    const current = document.documentElement.getAttribute("data-theme") || "standard";
    const next = THEMES[(THEMES.indexOf(current) + 1) % THEMES.length];
    document.documentElement.setAttribute("data-theme", next);
    writeStore(THEME_KEY, next);
  }

  /* ---------- actions ---------- */

  function addItem() {
    const input = document.getElementById("itemInput");
    const name = input.value.trim();
    if (!name) return;
    items.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: name,
      category: guessCategory(name),
      qty: 1,
      bought: false,
    });
    input.value = "";
    input.focus();
    saveItems();
    render();
  }

  function toggleBought(id) {
    const it = items.find(i => i.id === id);
    if (!it) return;
    it.bought = !it.bought;
    const today = todayStr();
    const entries = Array.isArray(history[today]) ? history[today] : [];
    if (it.bought) {
      entries.push({ id: it.id, name: it.name, qty: it.qty });
    } else {
      const idx = entries.map(e => e.id).lastIndexOf(it.id);
      if (idx !== -1) entries.splice(idx, 1);
    }
    history[today] = entries;
    saveHistory();
    saveItems();
    render();
  }

  function removeItem(id) {
    items = items.filter(i => i.id !== id);
    if (editingId === id) editingId = null;
    saveItems();
    render();
  }

  function changeQty(id, delta) {
    const it = items.find(i => i.id === id);
    if (!it) return;
    it.qty = Math.max(1, it.qty + delta);
    if (it.bought && syncHistoryEntry(it)) saveHistory();
    saveItems();
    render();
  }

  function startEdit(id) {
    editingId = id;
    render();
    const input = document.getElementById("edit-" + id);
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }

  function saveEdit(id, newName) {
    if (editingId !== id) return;   // Enter-এর পর blur দ্বিতীয়বার সেভ করবে না
    editingId = null;
    const it = items.find(i => i.id === id);
    const trimmed = newName.trim();
    if (it && trimmed && trimmed !== it.name) {
      it.name = trimmed;
      it.category = guessCategory(trimmed);
      if (it.bought && syncHistoryEntry(it)) saveHistory();
      saveItems();
    }
    render();
  }

  function cancelEdit() {
    editingId = null;
    render();
  }

  function clearBought() {
    items = items.filter(i => !i.bought);
    saveItems();
    render();
  }

  /* ---------- render ---------- */

  function buildRow(it) {
    const row = document.createElement("div");
    row.className = "item-row";
    const cat = catInfo(it.category);
    row.style.borderLeftColor = cat.color;

    const checkbox = document.createElement("button");
    checkbox.className = "checkbox" + (it.bought ? " checked" : "");
    checkbox.textContent = it.bought ? "✓" : "";
    checkbox.title = it.bought ? "আবার লিস্টে ফেরত দাও" : "কেনা হয়ে গেছে";
    checkbox.onclick = () => toggleBought(it.id);
    row.appendChild(checkbox);

    if (editingId === it.id) {
      const editInput = document.createElement("input");
      editInput.className = "item-name-input";
      editInput.id = "edit-" + it.id;
      editInput.value = it.name;
      editInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") saveEdit(it.id, editInput.value);
        else if (e.key === "Escape") cancelEdit();
      });
      editInput.addEventListener("blur", () => saveEdit(it.id, editInput.value));
      row.appendChild(editInput);
    } else {
      const nameEl = document.createElement("span");
      nameEl.className = "item-name" + (it.bought ? " done" : "");
      nameEl.textContent = it.name;
      row.appendChild(nameEl);
    }

    const qtyBox = document.createElement("div");
    qtyBox.className = "qty-box";
    const minusBtn = document.createElement("button");
    minusBtn.className = "qty-btn"; minusBtn.textContent = "–"; minusBtn.title = "কমাও";
    minusBtn.onclick = () => changeQty(it.id, -1);
    qtyBox.appendChild(minusBtn);
    const qtyVal = document.createElement("span");
    qtyVal.className = "qty-val"; qtyVal.textContent = it.qty;
    qtyBox.appendChild(qtyVal);
    const plusBtn = document.createElement("button");
    plusBtn.className = "qty-btn"; plusBtn.textContent = "+"; plusBtn.title = "বাড়াও";
    plusBtn.onclick = () => changeQty(it.id, 1);
    qtyBox.appendChild(plusBtn);
    row.appendChild(qtyBox);

    const editBtn = document.createElement("button");
    editBtn.className = "icon-btn edit-btn"; editBtn.textContent = "✎"; editBtn.title = "এডিট করো";
    editBtn.onclick = () => startEdit(it.id);
    row.appendChild(editBtn);

    const removeBtn = document.createElement("button");
    removeBtn.className = "icon-btn remove-btn"; removeBtn.textContent = "✕"; removeBtn.title = "ডিলিট করো";
    removeBtn.onclick = () => removeItem(it.id);
    row.appendChild(removeBtn);

    return row;
  }

  function renderGroupedList(container, itemsList, emptyMsg) {
    container.innerHTML = "";
    if (itemsList.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = emptyMsg;
      container.appendChild(empty);
      return;
    }
    CATEGORIES.forEach(cat => {
      const catItems = itemsList.filter(i => i.category === cat.key);
      if (catItems.length === 0) return;
      const label = document.createElement("div");
      label.className = "cat-label";
      label.textContent = cat.label;
      label.style.color = cat.color;
      label.style.backgroundColor = cat.bg;
      container.appendChild(label);
      catItems.forEach(it => container.appendChild(buildRow(it)));
    });
  }

  function renderHeaderDate() {
    const dateEl = document.getElementById("headerDate");
    if (!dateEl) return;
    dateEl.textContent = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  }

  function render() {
    const toBuyItems = items.filter(i => !i.bought);
    const boughtItems = items.filter(i => i.bought);

    document.getElementById("countToBuy").textContent = toBuyItems.length;
    document.getElementById("countBought").textContent = boughtItems.length;

    renderGroupedList(document.getElementById("listToBuy"), toBuyItems, "🛒 লিস্ট খালি<br>উপরে আইটেম যোগ করো");
    renderGroupedList(document.getElementById("listBought"), boughtItems, "এখনো কিছু কেনা হয়নি");

    document.getElementById("clearBtn").style.display = boughtItems.length > 0 ? "inline-block" : "none";

    const today = todayStr();
    if (today !== lastRenderedDay) {
      lastRenderedDay = today;
      renderHeaderDate();
    }
  }

  function searchHistory() {
    const key = document.getElementById("historyDate").value;
    const resultEl = document.getElementById("historyResult");
    resultEl.innerHTML = "";

    const showEmpty = (msg) => {
      const empty = document.createElement("div");
      empty.className = "empty"; empty.textContent = msg;
      resultEl.appendChild(empty);
    };

    if (!key) return showEmpty("তারিখ বেছে নাও");
    const entries = history[key] || [];
    if (entries.length === 0) return showEmpty("এই তারিখে কিছু কেনা হয়নি");

    entries.forEach((entry) => {
      const row = document.createElement("div");
      row.className = "item-row";
      row.style.borderLeftColor = "var(--accent)";
      const nameEl = document.createElement("span");
      nameEl.className = "item-name";
      nameEl.textContent = entry.name;
      row.appendChild(nameEl);
      const qtyEl = document.createElement("span");
      qtyEl.style.fontSize = "12px"; qtyEl.style.fontWeight = "700"; qtyEl.style.color = "var(--accent)";
      qtyEl.textContent = "x" + entry.qty;
      row.appendChild(qtyEl);
      resultEl.appendChild(row);
    });
  }

  /* ---------- boot ---------- */

  document.getElementById("addBtn").addEventListener("click", addItem);
  document.getElementById("itemInput").addEventListener("keydown", (e) => { if (e.key === "Enter") addItem(); });
  document.getElementById("clearBtn").addEventListener("click", clearBought);
  document.getElementById("historyBtn").addEventListener("click", searchHistory);
  document.getElementById("historyDate").addEventListener("change", searchHistory);
  document.getElementById("themeBtn").addEventListener("click", cycleTheme);
  document.getElementById("ownerBtn").addEventListener("click", openOwnerEdit);
  document.getElementById("ownerSave").addEventListener("click", saveOwner);
  document.getElementById("ownerCancel").addEventListener("click", closeOwnerEdit);
  document.getElementById("ownerPhoneInput").addEventListener("keydown", (e) => { if (e.key === "Enter") saveOwner(); });

  loadOwner();
  renderOwner();
  loadItems();
  loadHistory();
  if (pruneHistory()) saveHistory();
  checkDailyReset();
  render();

  setInterval(() => {
    if (checkDailyReset() && editingId === null) render();
  }, 60000);

  // অ্যাপ আবার সামনে এলে (ট্যাব সুইচ/স্ক্রিন অন) দিন বদলেছে কিনা দেখা
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && checkDailyReset() && editingId === null) render();
  });

  // অফলাইনে চালানোর জন্য service worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
